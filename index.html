<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI เขียนให้</title>
<style>
  :root {
    --bg: #0f0f13;
    --surface: #1a1a24;
    --surface2: #24243a;
    --border: #2e2e4a;
    --accent: #7c6ef5;
    --accent2: #a78bfa;
    --text: #e8e8f0;
    --text-muted: #888899;
    --success: #4ade80;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 1.25rem 2rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 0.75rem;
    background: var(--surface);
  }

  header .logo {
    width: 36px;
    height: 36px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
  }

  header h1 {
    font-size: 1.2rem;
    font-weight: 600;
    background: linear-gradient(135deg, var(--accent2), #c4b5fd);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  main {
    flex: 1;
    max-width: 860px;
    width: 100%;
    margin: 0 auto;
    padding: 2rem 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 1.25rem 1.5rem;
  }

  label {
    display: block;
    font-size: 0.82rem;
    font-weight: 500;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 0.6rem;
  }

  .type-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 0.5rem;
  }

  .type-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.55rem 0.75rem;
    color: var(--text-muted);
    font-size: 0.88rem;
    cursor: pointer;
    transition: all 0.15s;
    text-align: left;
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }

  .type-btn:hover { border-color: var(--accent); color: var(--text); }
  .type-btn.active {
    border-color: var(--accent);
    background: rgba(124, 110, 245, 0.15);
    color: var(--accent2);
  }

  .tone-row {
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
  }

  .tone-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 0.35rem 0.9rem;
    color: var(--text-muted);
    font-size: 0.83rem;
    cursor: pointer;
    transition: all 0.15s;
  }

  .tone-btn:hover { border-color: var(--accent); color: var(--text); }
  .tone-btn.active {
    border-color: var(--accent);
    background: rgba(124, 110, 245, 0.15);
    color: var(--accent2);
  }

  textarea {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.9rem 1rem;
    color: var(--text);
    font-size: 0.95rem;
    font-family: inherit;
    resize: vertical;
    min-height: 110px;
    transition: border-color 0.15s;
    line-height: 1.6;
  }

  textarea:focus { outline: none; border-color: var(--accent); }
  textarea::placeholder { color: var(--text-muted); }

  .length-row {
    display: flex;
    gap: 0.5rem;
  }

  .length-btn {
    flex: 1;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.45rem;
    color: var(--text-muted);
    font-size: 0.83rem;
    cursor: pointer;
    transition: all 0.15s;
    text-align: center;
  }

  .length-btn:hover { border-color: var(--accent); color: var(--text); }
  .length-btn.active {
    border-color: var(--accent);
    background: rgba(124, 110, 245, 0.15);
    color: var(--accent2);
  }

  .api-row {
    display: flex;
    gap: 0.75rem;
    align-items: center;
  }

  .api-row input {
    flex: 1;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.6rem 0.9rem;
    color: var(--text);
    font-size: 0.88rem;
    font-family: monospace;
    transition: border-color 0.15s;
  }

  .api-row input:focus { outline: none; border-color: var(--accent); }
  .api-row input::placeholder { color: var(--text-muted); }

  .api-hint {
    font-size: 0.78rem;
    color: var(--text-muted);
    margin-top: 0.5rem;
  }

  .api-hint a { color: var(--accent2); text-decoration: none; }

  .generate-btn {
    width: 100%;
    padding: 0.85rem;
    background: linear-gradient(135deg, var(--accent), #6d5ce7);
    border: none;
    border-radius: 10px;
    color: #fff;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.1s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
  }

  .generate-btn:hover { opacity: 0.9; transform: translateY(-1px); }
  .generate-btn:active { transform: translateY(0); }
  .generate-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  .output-area {
    display: none;
    flex-direction: column;
    gap: 0.75rem;
  }

  .output-area.visible { display: flex; }

  .output-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .output-header span {
    font-size: 0.82rem;
    font-weight: 500;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  .copy-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 0.35rem 0.75rem;
    color: var(--text-muted);
    font-size: 0.8rem;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    gap: 0.35rem;
  }

  .copy-btn:hover { border-color: var(--accent); color: var(--text); }
  .copy-btn.copied { border-color: var(--success); color: var(--success); }

  .output-text {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1.25rem;
    font-size: 0.95rem;
    line-height: 1.8;
    white-space: pre-wrap;
    min-height: 120px;
  }

  .spinner {
    width: 18px;
    height: 18px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .error-msg {
    background: rgba(239, 68, 68, 0.1);
    border: 1px solid rgba(239, 68, 68, 0.3);
    border-radius: 8px;
    padding: 0.75rem 1rem;
    font-size: 0.88rem;
    color: #fca5a5;
    display: none;
  }

  .error-msg.visible { display: block; }

  @media (max-width: 600px) {
    main { padding: 1rem; }
    .type-grid { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>

<header>
  <div class="logo">✍️</div>
  <h1>AI เขียนให้</h1>
</header>

<main>

  <!-- Writing type -->
  <div class="card">
    <label>ประเภทงานเขียน</label>
    <div class="type-grid" id="typeGrid">
      <button class="type-btn active" data-type="essay">📝 บทความ</button>
      <button class="type-btn" data-type="email">📧 อีเมล</button>
      <button class="type-btn" data-type="story">📖 เรื่องสั้น</button>
      <button class="type-btn" data-type="social">📲 โซเชียล</button>
      <button class="type-btn" data-type="speech">🎤 สุนทรพจน์</button>
      <button class="type-btn" data-type="report">📊 รายงาน</button>
      <button class="type-btn" data-type="poem">🌸 บทกวี</button>
      <button class="type-btn" data-type="ad">📣 โฆษณา</button>
    </div>
  </div>

  <!-- Topic / prompt -->
  <div class="card">
    <label>หัวข้อ / สิ่งที่ต้องการ</label>
    <textarea id="topicInput" placeholder="เช่น: เขียนบทความเกี่ยวกับประโยชน์ของการออกกำลังกายทุกวัน…"></textarea>
  </div>

  <!-- Tone -->
  <div class="card">
    <label>โทนเสียง</label>
    <div class="tone-row" id="toneRow">
      <button class="tone-btn active" data-tone="professional">มืออาชีพ</button>
      <button class="tone-btn" data-tone="casual">ทั่วไป</button>
      <button class="tone-btn" data-tone="friendly">เป็นมิตร</button>
      <button class="tone-btn" data-tone="formal">ทางการ</button>
      <button class="tone-btn" data-tone="creative">สร้างสรรค์</button>
      <button class="tone-btn" data-tone="humorous">ตลกขบขัน</button>
    </div>
  </div>

  <!-- Length -->
  <div class="card">
    <label>ความยาว</label>
    <div class="length-row" id="lengthRow">
      <button class="length-btn" data-length="short">สั้น<br><small style="color:var(--text-muted)">~100 คำ</small></button>
      <button class="length-btn active" data-length="medium">กลาง<br><small style="color:var(--text-muted)">~300 คำ</small></button>
      <button class="length-btn" data-length="long">ยาว<br><small style="color:var(--text-muted)">~600 คำ</small></button>
    </div>
  </div>

  <!-- API Key -->
  <div class="card">
    <label>Gemini API Key</label>
    <div class="api-row">
      <input type="password" id="apiKey" placeholder="AIza…">
    </div>
    <p class="api-hint">รับ API Key ได้ฟรีที่ <a href="https://aistudio.google.com/apikey" target="_blank">aistudio.google.com/apikey</a></p>
  </div>

  <!-- Error -->
  <div class="error-msg" id="errorMsg"></div>

  <!-- Generate button -->
  <button class="generate-btn" id="generateBtn" onclick="generate()">
    <span>✨ เขียนให้เลย</span>
  </button>

  <!-- Output -->
  <div class="output-area" id="outputArea">
    <div class="card">
      <div class="output-header">
        <span>ผลลัพธ์</span>
        <button class="copy-btn" id="copyBtn" onclick="copyOutput()">
          📋 คัดลอก
        </button>
      </div>
      <div class="output-text" id="outputText"></div>
    </div>
  </div>

</main>

<script>
  let selectedType = 'essay';
  let selectedTone = 'professional';
  let selectedLength = 'medium';

  const typeLabels = {
    essay: 'บทความ', email: 'อีเมล', story: 'เรื่องสั้น',
    social: 'โพสต์โซเชียลมีเดีย', speech: 'สุนทรพจน์',
    report: 'รายงาน', poem: 'บทกวี', ad: 'สำเนาโฆษณา'
  };
  const toneLabels = {
    professional: 'มืออาชีพ', casual: 'ทั่วไปและเข้าถึงง่าย',
    friendly: 'เป็นกันเอง', formal: 'ทางการ',
    creative: 'สร้างสรรค์และน่าสนใจ', humorous: 'ตลกขบขัน'
  };
  const lengthMap = { short: 100, medium: 300, long: 600 };

  document.getElementById('typeGrid').addEventListener('click', e => {
    const btn = e.target.closest('.type-btn');
    if (!btn) return;
    document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    selectedType = btn.dataset.type;
  });

  document.getElementById('toneRow').addEventListener('click', e => {
    const btn = e.target.closest('.tone-btn');
    if (!btn) return;
    document.querySelectorAll('.tone-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    selectedTone = btn.dataset.tone;
  });

  document.getElementById('lengthRow').addEventListener('click', e => {
    const btn = e.target.closest('.length-btn');
    if (!btn) return;
    document.querySelectorAll('.length-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    selectedLength = btn.dataset.length;
  });

  async function generate() {
    const topic = document.getElementById('topicInput').value.trim();
    const apiKey = document.getElementById('apiKey').value.trim();
    const btn = document.getElementById('generateBtn');
    const errorMsg = document.getElementById('errorMsg');

    errorMsg.classList.remove('visible');

    if (!topic) {
      showError('กรุณาใส่หัวข้อหรือสิ่งที่ต้องการก่อนนะ');
      return;
    }
    if (!apiKey) {
      showError('กรุณาใส่ Gemini API Key ก่อน');
      return;
    }

    btn.disabled = true;
    btn.innerHTML = '<div class="spinner"></div><span>กำลังเขียน…</span>';

    const words = lengthMap[selectedLength];
    const prompt = `คุณเป็นนักเขียนมืออาชีพชาวไทย โปรดเขียน${typeLabels[selectedType]}ในภาษาไทย
โทนเสียง: ${toneLabels[selectedTone]}
ความยาวประมาณ ${words} คำ

คำขอ: ${topic}

เขียนให้สมบูรณ์ ไม่ต้องมีคำนำหน้าหรือคำอธิบาย ให้เนื้อหาตรงๆ เลย`;

    try {
      const res = await fetch(
        `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`,
        {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: prompt }] }],
            generationConfig: { temperature: 0.85, maxOutputTokens: 2048 }
          })
        }
      );

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err?.error?.message || `HTTP ${res.status}`);
      }

      const data = await res.json();
      const text = data?.candidates?.[0]?.content?.parts?.[0]?.text;

      if (!text) throw new Error('ไม่ได้รับผลลัพธ์จาก API');

      document.getElementById('outputText').textContent = text;
      document.getElementById('outputArea').classList.add('visible');
      document.getElementById('outputArea').scrollIntoView({ behavior: 'smooth', block: 'start' });

    } catch (err) {
      showError('เกิดข้อผิดพลาด: ' + err.message);
    } finally {
      btn.disabled = false;
      btn.innerHTML = '<span>✨ เขียนให้เลย</span>';
    }
  }

  function showError(msg) {
    const el = document.getElementById('errorMsg');
    el.textContent = msg;
    el.classList.add('visible');
  }

  function copyOutput() {
    const text = document.getElementById('outputText').textContent;
    navigator.clipboard.writeText(text).then(() => {
      const btn = document.getElementById('copyBtn');
      btn.textContent = '✅ คัดลอกแล้ว';
      btn.classList.add('copied');
      setTimeout(() => {
        btn.textContent = '📋 คัดลอก';
        btn.classList.remove('copied');
      }, 2000);
    });
  }
</script>

</body>
</html>
