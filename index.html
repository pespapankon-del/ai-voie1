<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Writing Assistant</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0f0f1a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      border-bottom: 1px solid #2d3748;
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    header .logo {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
    }

    header h1 {
      font-size: 1.25rem;
      font-weight: 600;
      background: linear-gradient(135deg, #a78bfa, #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .main {
      flex: 1;
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: 0;
      height: calc(100vh - 65px);
    }

    .sidebar {
      background: #1a1a2e;
      border-right: 1px solid #2d3748;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      overflow-y: auto;
    }

    .sidebar h3 {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #718096;
      margin-bottom: 0.25rem;
    }

    .mode-btn {
      width: 100%;
      padding: 0.6rem 0.875rem;
      background: transparent;
      border: 1px solid #2d3748;
      border-radius: 8px;
      color: #a0aec0;
      text-align: left;
      cursor: pointer;
      font-size: 0.875rem;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .mode-btn:hover { background: #2d3748; color: #e2e8f0; }
    .mode-btn.active {
      background: linear-gradient(135deg, #553c9a22, #44337a33);
      border-color: #7c3aed;
      color: #a78bfa;
    }

    .tone-group {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
    }

    .tone-chip {
      padding: 0.3rem 0.6rem;
      border-radius: 20px;
      border: 1px solid #2d3748;
      background: transparent;
      color: #a0aec0;
      font-size: 0.75rem;
      cursor: pointer;
      transition: all 0.15s;
    }

    .tone-chip:hover { border-color: #7c3aed; color: #a78bfa; }
    .tone-chip.active {
      background: #7c3aed22;
      border-color: #7c3aed;
      color: #a78bfa;
    }

    .length-group { display: flex; gap: 0.4rem; }
    .length-btn {
      flex: 1;
      padding: 0.4rem;
      border-radius: 6px;
      border: 1px solid #2d3748;
      background: transparent;
      color: #a0aec0;
      font-size: 0.75rem;
      cursor: pointer;
      transition: all 0.15s;
    }
    .length-btn:hover { border-color: #7c3aed; color: #a78bfa; }
    .length-btn.active {
      background: #7c3aed22;
      border-color: #7c3aed;
      color: #a78bfa;
    }

    .content-area {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .editor-section {
      flex: 1;
      display: grid;
      grid-template-rows: 1fr auto 1fr;
      gap: 0;
      overflow: hidden;
    }

    .pane {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .pane-header {
      padding: 0.625rem 1rem;
      background: #1a1a2e;
      border-bottom: 1px solid #2d3748;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .pane-title {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #718096;
    }

    .pane-actions { display: flex; gap: 0.5rem; }

    .btn-sm {
      padding: 0.25rem 0.625rem;
      border-radius: 5px;
      border: 1px solid #2d3748;
      background: transparent;
      color: #a0aec0;
      font-size: 0.75rem;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-sm:hover { background: #2d3748; color: #e2e8f0; }

    textarea {
      flex: 1;
      resize: none;
      background: #0f0f1a;
      border: none;
      color: #e2e8f0;
      padding: 1rem;
      font-size: 0.9rem;
      line-height: 1.7;
      font-family: inherit;
      outline: none;
    }

    textarea::placeholder { color: #4a5568; }

    .divider {
      padding: 0.5rem 1rem;
      background: #16213e;
      border-top: 1px solid #2d3748;
      border-bottom: 1px solid #2d3748;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .api-key-input {
      flex: 1;
      background: #0f0f1a;
      border: 1px solid #2d3748;
      border-radius: 6px;
      padding: 0.4rem 0.75rem;
      color: #e2e8f0;
      font-size: 0.8rem;
      outline: none;
      transition: border-color 0.15s;
    }
    .api-key-input:focus { border-color: #7c3aed; }

    .generate-btn {
      padding: 0.5rem 1.25rem;
      background: linear-gradient(135deg, #7c3aed, #4f46e5);
      border: none;
      border-radius: 6px;
      color: #fff;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
      white-space: nowrap;
    }

    .generate-btn:hover { opacity: 0.9; }
    .generate-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .output-pane {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      font-size: 0.9rem;
      line-height: 1.7;
      white-space: pre-wrap;
      color: #cbd5e0;
    }

    .output-pane.empty { color: #4a5568; font-style: italic; }

    .output-pane .thinking {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: #7c3aed;
      font-style: italic;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid #7c3aed44;
      border-top-color: #7c3aed;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .char-count {
      font-size: 0.7rem;
      color: #4a5568;
    }

    .lang-toggle {
      display: flex;
      gap: 0.4rem;
    }

    .lang-btn {
      padding: 0.25rem 0.5rem;
      border-radius: 4px;
      border: 1px solid #2d3748;
      background: transparent;
      color: #718096;
      font-size: 0.7rem;
      cursor: pointer;
      transition: all 0.15s;
    }
    .lang-btn.active {
      border-color: #7c3aed;
      color: #a78bfa;
      background: #7c3aed22;
    }
  </style>
</head>
<body>

<header>
  <div class="logo">✍️</div>
  <h1>AI Writing Assistant</h1>
</header>

<div class="main">
  <aside class="sidebar">
    <div>
      <h3>โหมดการเขียน</h3>
      <div style="display:flex;flex-direction:column;gap:0.4rem;margin-top:0.5rem">
        <button class="mode-btn active" data-mode="improve">✨ ปรับปรุงข้อความ</button>
        <button class="mode-btn" data-mode="expand">📖 ขยายความ</button>
        <button class="mode-btn" data-mode="summarize">📋 สรุปย่อ</button>
        <button class="mode-btn" data-mode="translate">🌐 แปลภาษา</button>
        <button class="mode-btn" data-mode="email">📧 เขียนอีเมล</button>
        <button class="mode-btn" data-mode="social">📱 โซเชียลมีเดีย</button>
        <button class="mode-btn" data-mode="story">📚 เล่าเรื่อง</button>
        <button class="mode-btn" data-mode="freewrite">💬 เขียนอิสระ</button>
      </div>
    </div>

    <div>
      <h3>โทนเสียง</h3>
      <div class="tone-group" style="margin-top:0.5rem">
        <button class="tone-chip active" data-tone="professional">มืออาชีพ</button>
        <button class="tone-chip" data-tone="casual">ทั่วไป</button>
        <button class="tone-chip" data-tone="friendly">เป็นกันเอง</button>
        <button class="tone-chip" data-tone="formal">ทางการ</button>
        <button class="tone-chip" data-tone="persuasive">โน้มน้าว</button>
        <button class="tone-chip" data-tone="creative">สร้างสรรค์</button>
      </div>
    </div>

    <div>
      <h3>ความยาว</h3>
      <div class="length-group" style="margin-top:0.5rem">
        <button class="length-btn" data-len="short">สั้น</button>
        <button class="length-btn active" data-len="medium">กลาง</button>
        <button class="length-btn" data-len="long">ยาว</button>
      </div>
    </div>

    <div>
      <h3>ภาษาผลลัพธ์</h3>
      <div class="lang-toggle" style="margin-top:0.5rem">
        <button class="lang-btn active" data-lang="th">ไทย</button>
        <button class="lang-btn" data-lang="en">English</button>
        <button class="lang-btn" data-lang="auto">Auto</button>
      </div>
    </div>
  </aside>

  <div class="content-area">
    <div class="editor-section">
      <div class="pane">
        <div class="pane-header">
          <span class="pane-title">ข้อความต้นฉบับ / คำสั่ง</span>
          <div class="pane-actions">
            <button class="btn-sm" id="clearBtn">ล้าง</button>
            <span class="char-count" id="charCount">0 ตัวอักษร</span>
          </div>
        </div>
        <textarea id="inputText" placeholder="พิมพ์ข้อความที่ต้องการให้ AI ช่วยเขียน ปรับปรุง หรือแปล...&#10;&#10;ตัวอย่าง: เขียนอีเมลขอโทษลูกค้าที่สินค้ามาช้า ให้ฟังดูจริงใจ"></textarea>
      </div>

      <div class="divider">
        <input type="password" class="api-key-input" id="apiKey" placeholder="🔑 Gemini API Key (ได้จาก aistudio.google.com)" />
        <button class="generate-btn" id="generateBtn">⚡ สร้าง</button>
      </div>

      <div class="pane">
        <div class="pane-header">
          <span class="pane-title">ผลลัพธ์จาก AI</span>
          <div class="pane-actions">
            <button class="btn-sm" id="copyBtn">คัดลอก</button>
            <button class="btn-sm" id="useAsInputBtn">ใช้เป็น Input</button>
          </div>
        </div>
        <div class="output-pane empty" id="output">ผลลัพธ์จะแสดงที่นี่...</div>
      </div>
    </div>
  </div>
</div>

<script>
  const state = {
    mode: 'improve',
    tone: 'professional',
    length: 'medium',
    lang: 'th',
  };

  // Mode buttons
  document.querySelectorAll('.mode-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      state.mode = btn.dataset.mode;
    });
  });

  // Tone chips
  document.querySelectorAll('.tone-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      document.querySelectorAll('.tone-chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      state.tone = chip.dataset.tone;
    });
  });

  // Length buttons
  document.querySelectorAll('.length-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.length-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      state.length = btn.dataset.len;
    });
  });

  // Lang buttons
  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      state.lang = btn.dataset.lang;
    });
  });

  // Char count
  const inputText = document.getElementById('inputText');
  inputText.addEventListener('input', () => {
    document.getElementById('charCount').textContent = `${inputText.value.length} ตัวอักษร`;
  });

  // Clear
  document.getElementById('clearBtn').addEventListener('click', () => {
    inputText.value = '';
    document.getElementById('charCount').textContent = '0 ตัวอักษร';
  });

  // Copy
  document.getElementById('copyBtn').addEventListener('click', () => {
    const out = document.getElementById('output');
    if (!out.classList.contains('empty')) {
      navigator.clipboard.writeText(out.textContent);
      const btn = document.getElementById('copyBtn');
      btn.textContent = 'คัดลอกแล้ว!';
      setTimeout(() => btn.textContent = 'คัดลอก', 1500);
    }
  });

  // Use output as input
  document.getElementById('useAsInputBtn').addEventListener('click', () => {
    const out = document.getElementById('output');
    if (!out.classList.contains('empty')) {
      inputText.value = out.textContent;
      document.getElementById('charCount').textContent = `${inputText.value.length} ตัวอักษร`;
    }
  });

  function buildPrompt(text, mode, tone, length, lang) {
    const toneMap = {
      professional: 'มืออาชีพ', casual: 'ทั่วไป ไม่เป็นทางการ',
      friendly: 'เป็นกันเอง อบอุ่น', formal: 'ทางการ สุภาพ',
      persuasive: 'โน้มน้าวใจ น่าเชื่อถือ', creative: 'สร้างสรรค์ มีสีสัน',
    };
    const lenMap = { short: 'สั้นกระชับ (1-2 ย่อหน้า)', medium: 'ปานกลาง (3-4 ย่อหน้า)', long: 'ยาวและละเอียด' };
    const langMap = { th: 'ภาษาไทย', en: 'English', auto: 'ภาษาเดิมของข้อความต้นฉบับ' };

    const modeInstructions = {
      improve: `ปรับปรุงและพัฒนาข้อความต่อไปนี้ให้ดีขึ้น แก้ไขไวยากรณ์ ความชัดเจน และความไหลลื่นของภาษา`,
      expand: `ขยายความข้อความต่อไปนี้ให้ละเอียดและสมบูรณ์ยิ่งขึ้น เพิ่มตัวอย่าง รายละเอียด และบริบท`,
      summarize: `สรุปย่อข้อความต่อไปนี้ให้กระชับ ครอบคลุมประเด็นสำคัญทั้งหมด`,
      translate: `แปลข้อความต่อไปนี้เป็น${langMap[lang] === 'ภาษาเดิม' ? 'ภาษาอังกฤษหากเป็นไทย หรือภาษาไทยหากเป็นอังกฤษ' : langMap[lang]}`,
      email: `เขียนอีเมลจากข้อความหรือคำสั่งต่อไปนี้ รวมถึงหัวข้ออีเมลและเนื้อหาที่สมบูรณ์`,
      social: `เขียนโพสต์โซเชียลมีเดียจากข้อความหรือคำสั่งต่อไปนี้ ให้น่าสนใจ มีการใช้ emoji และ hashtag ที่เหมาะสม`,
      story: `เล่าเรื่องหรือเขียนเนื้อหาในรูปแบบเรื่องเล่าจากข้อความหรือคำสั่งต่อไปนี้`,
      freewrite: `เขียนเนื้อหาตามคำสั่งหรือหัวข้อต่อไปนี้`,
    };

    return `คุณเป็นผู้ช่วยเขียนที่เชี่ยวชาญ

งาน: ${modeInstructions[mode]}

โทนเสียง: ${toneMap[tone]}
ความยาว: ${lenMap[length]}
ภาษาที่ใช้ในผลลัพธ์: ${langMap[lang]}

ข้อความ/คำสั่ง:
"""
${text}
"""

ให้ผลลัพธ์เฉพาะเนื้อหาที่เขียนแล้ว ไม่ต้องอธิบายหรือเพิ่มคำนำ`;
  }

  document.getElementById('generateBtn').addEventListener('click', async () => {
    const text = inputText.value.trim();
    const apiKey = document.getElementById('apiKey').value.trim();
    const output = document.getElementById('output');
    const btn = document.getElementById('generateBtn');

    if (!text) { alert('กรุณาใส่ข้อความหรือคำสั่ง'); return; }
    if (!apiKey) { alert('กรุณาใส่ Gemini API Key'); return; }

    btn.disabled = true;
    output.classList.remove('empty');
    output.innerHTML = '<div class="thinking"><div class="spinner"></div> AI กำลังประมวลผล...</div>';

    const prompt = buildPrompt(text, state.mode, state.tone, state.length, state.lang);

    try {
      const response = await fetch(
        `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`,
        {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: prompt }] }],
            generationConfig: { temperature: 0.8, maxOutputTokens: 2048 },
          }),
        }
      );

      if (!response.ok) {
        const err = await response.json();
        throw new Error(err.error?.message || `HTTP ${response.status}`);
      }

      const data = await response.json();
      const result = data.candidates?.[0]?.content?.parts?.[0]?.text || 'ไม่มีผลลัพธ์';
      output.textContent = result;
    } catch (err) {
      output.innerHTML = `<span style="color:#fc8181">❌ เกิดข้อผิดพลาด: ${err.message}</span>`;
    } finally {
      btn.disabled = false;
    }
  });

  // Allow Ctrl+Enter to generate
  inputText.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
      document.getElementById('generateBtn').click();
    }
  });
</script>
</body>
</html>
